name: Testes do motor

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Núcleo do CFR (Kuhn Poker, exploitability conhecida)
        run: python tests/kuhn_poker.py

      - name: ICM (Malmuth-Harville) — propriedades matemáticas
        run: python tests/icm.py

      - name: Equity pré-flop — contra números conhecidos
        run: python tests/equity.py

      - name: Pós-flop river (MDF exata + exploitability rigorosa)
        run: python tests/postflop_river.py

      - name: Pós-flop river — exploitability
        run: python tests/postflop_exploitability.py

      - name: Pós-flop turn (MDF + cross-check de runout_equity)
        run: python tests/postflop_turn.py

      - name: Pós-flop — EV por ação (gap de erro vs decisão marginal)
        run: python tests/postflop_action_evs.py

      - name: RFI/Jam multi-tamanho (regressão contra motor legado)
        run: python tests/rfi_jam_multisize.py

      - name: RFI/Jam — modo chipEV puro (vs ICM, Push/Fold incluso)
        run: python tests/rfi_jam_chipev.py

      - name: RFI multiway — regressão contra motor heads-up (lockstep) + sanidade
        run: python tests/multiway_rfi.py

      - name: RFI multiway — modo chipEV puro (vs ICM sob pressão de bolha)
        run: python tests/multiway_rfi_chipev.py

      - name: RFI multiway — prova do vazamento em compute_exploitability + medição exata (2 seats)
        run: python tests/multiway_exploitability_2seat.py

      - name: Push/Fold (chip EV puro)
        run: python tests/pushfold.py

      - name: Push/Fold com ICM
        run: python tests/pushfold_icm.py

      - name: cEV/ICM de mão jogada (heads-up)
        run: python tests/hand_cev.py

      - name: cEV/ICM de mão jogada (multiway)
        run: python tests/hand_cev_multiway.py
